<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoDeck — Technical Documentation & Architecture</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/global.css?v=4.0">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/js/global.js?v=4.0" defer></script>

    <style>
        .docs-layout {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 70px);
        }

        .docs-sidebar {
            width: 280px;
            border-right: 1px solid var(--card-border);
            padding: 32px 20px;
            background: rgba(12, 12, 16, 0.5);
            backdrop-filter: blur(12px);
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            padding-left: 12px;
        }

        .doc-nav-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-muted);
            background: transparent;
            border: 1px solid transparent;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            margin-bottom: 6px;
        }

        .doc-nav-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .doc-nav-btn.active {
            color: #ffffff;
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .docs-content {
            flex: 1;
            padding: 40px 60px;
            max-width: 900px;
            line-height: 1.7;
        }

        /* Markdown Styling inside Documentation Viewer */
        .markdown-body { color: var(--text-main); font-size: 0.95rem; }
        .markdown-body h1 { font-size: 2.2rem; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-top: 0; color: var(--primary); }
        .markdown-body h2 { font-size: 1.5rem; margin-top: 36px; border-bottom: 1px solid var(--border); padding-bottom: 8px; color: var(--primary); }
        .markdown-body h3 { font-size: 1.2rem; margin-top: 24px; color: var(--text-main); }
        .markdown-body p { margin-bottom: 16px; color: var(--text-muted); }
        .markdown-body code { font-family: 'Fira Code', monospace; background: var(--bg-element); padding: 2px 6px; border-radius: 4px; font-size: 0.85em; color: var(--warning); }
        .markdown-body pre { background: var(--bg-element); padding: 16px; border-radius: 8px; border: 1px solid var(--border); overflow-x: auto; }
        .markdown-body pre code { background: transparent; padding: 0; color: var(--text-main); }
        .markdown-body table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; }
        .markdown-body th { background: var(--bg-element); font-weight: 700; }
        .markdown-body blockquote { border-left: 4px solid var(--primary); margin: 0; padding-left: 16px; color: var(--text-muted); }

        [data-theme="light"] .docs-sidebar { background: #ffffff !important; border-right-color: #e2e8f0 !important; }
        [data-theme="light"] .doc-nav-btn { color: #64748b !important; }
        [data-theme="light"] .doc-nav-btn:hover { color: #0f172a !important; background: #f1f5f9 !important; }
        [data-theme="light"] .doc-nav-btn.active { color: #0f172a !important; background: #e2e8f0 !important; border-color: #cbd5e1 !important; }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <div id="app-header"></div>

    <!-- Main Documentation Layout -->
    <div class="docs-layout">
        <!-- Sidebar Navigation -->
        <aside class="docs-sidebar">
            <div class="sidebar-title">Documentation</div>
            <button class="doc-nav-btn active" onclick="loadDoc('architecture.md', this)">
                <i class="fa-solid fa-sitemap"></i> System Architecture
            </button>
            <button class="doc-nav-btn" onclick="loadDoc('deployment_plan.md', this)">
                <i class="fa-solid fa-cloud-arrow-up"></i> Cloud Deployment
            </button>
            <button class="doc-nav-btn" onclick="loadDoc('distribution_plan.md', this)">
                <i class="fa-solid fa-globe"></i> Distribution Strategy
            </button>
            <button class="doc-nav-btn" onclick="loadDoc('implementation_plan.md', this)">
                <i class="fa-solid fa-list-check"></i> System Implementation
            </button>
        </aside>

        <!-- Main Content Area -->
        <main class="docs-content">
            <div id="doc-render-area" class="markdown-body">
                <div style="text-align: center; padding: 40px; color: var(--text-muted);">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 12px;"></i>
                    <div>Loading documentation...</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function loadDoc(fileName, btnEl) {
            if (btnEl) {
                document.querySelectorAll('.doc-nav-btn').forEach(b => b.classList.remove('active'));
                btnEl.classList.add('active');
            }

            const renderArea = document.getElementById('doc-render-area');
            renderArea.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-muted);"><i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 12px;"></i><div>Loading documentation...</div></div>`;

            const pathsToTry = [`/docs/${fileName}`, `docs/${fileName}`, `./docs/${fileName}`, `./${fileName}`];
            let loadedText = null;

            for (const p of pathsToTry) {
                try {
                    const res = await fetch(p);
                    if (res.ok) {
                        loadedText = await res.text();
                        break;
                    }
                } catch (e) {
                    // try next path
                }
            }

            if (loadedText) {
                renderArea.innerHTML = marked.parse(loadedText);
            } else {
                renderArea.innerHTML = `<div style="color: var(--danger); padding: 20px; text-align: center; border: 1px solid var(--border); border-radius: 8px;">Failed to load documentation file: ${fileName}.</div>`;
            }
        }

        // Auto-load document on startup (check query param or default to architecture.md)
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const docParam = params.get('doc') || 'architecture.md';
            const targetBtn = Array.from(document.querySelectorAll('.doc-nav-btn')).find(b => b.getAttribute('onclick').includes(docParam));
            loadDoc(docParam, targetBtn);
        });
    </script>
</body>
</html>
