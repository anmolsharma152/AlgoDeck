<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      var theme = localStorage.getItem('algodeck_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoDeck | Problem Dashboard</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Manrope:wght@200;300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/global.css?v=5.0">
  <script src="/js/global.js?v=5.0" defer></script>
  <style>


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Manrope', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 3rem;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem;
    }

    /* Compact Header Section */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .dashboard-header-titles h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    .dashboard-header-titles p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 2px;
    }

    /* Compact Unified Hero Metrics Panel */
    .hero-metrics-panel {
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .metrics-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .progress-summary {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 260px;
    }

    .progress-bar-container {
      flex: 1;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
      border-radius: 9999px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-text {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
    }

    .user-elo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 5px 14px;
      border-radius: 9999px;
      white-space: nowrap;
    }

    /* High-Density 4-Metric Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 0.85rem;
    }

    .metric-pill {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .metric-pill:hover {
      background: var(--bg-element);
    }

    .metric-pill-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .metric-pill-val {
      font-size: 1.15rem;
      font-weight: 800;
    }

    /* Consolidated Control Center & Filter Toolbar */
    .dashboard-toolbar {
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.15rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.7rem 1.15rem 0.7rem 2.5rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
    }

    .search-icon-pos {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-row-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      min-width: 100px;
      flex-shrink: 0;
    }

    .filter-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex: 1;
    }

    .btn-chip {
      padding: 4px 11px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-element);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      font-family: inherit;
    }

    .btn-chip:hover {
      background: var(--bg-surface);
      color: var(--primary);
      border-color: var(--border-hover);
    }

    .btn-chip.active {
      background: var(--primary) !important;
      color: #000000 !important;
      font-weight: 700 !important;
      border-color: var(--primary) !important;
    }

    /* Problems Grid & Cards */
    .problems-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.15rem;
    }

    .problem-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.85rem;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .problem-card:hover {
      transform: translateY(-2px);
      border-color: rgba(168, 85, 247, 0.4);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    .problem-header {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .problem-title-area {
      flex: 1;
      min-width: 0;
    }

    .problem-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      transition: color 0.2s;
      line-height: 1.35;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .problem-title:hover {
      color: var(--primary);
    }

    .problem-tags {
      display: flex;
      gap: 5px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .tag-easy { background: rgba(34, 197, 94, 0.15); color: #10b981; border: 1px solid rgba(34, 197, 94, 0.3); }
    .tag-medium { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
    .tag-hard { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
    .tag-pattern { background: rgba(168, 85, 247, 0.12); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.25); }

    .action-links {
      display: flex;
      gap: 8px;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      padding: 5px 11px;
      border-radius: 6px;
      transition: all 0.15s ease;
      border: 1px solid var(--border);
    }

    .action-btn.practice-btn {
      background: rgba(168, 85, 247, 0.15);
      color: var(--primary);
      border-color: rgba(168, 85, 247, 0.3);
    }

    .action-btn.practice-btn:hover {
      background: var(--primary);
      color: #000000;
      font-weight: 700;
    }

    .action-btn.external-btn {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
    }

    .action-btn.external-btn:hover {
      background: var(--bg-element);
      color: var(--text-main);
      border-color: var(--border-hover);
    }

    .problem-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 0.65rem;
    }

    .code-links a {
      color: var(--primary);
      text-decoration: none;
      font-family: 'Fira Code', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 0.5rem;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .code-links a:hover {
      opacity: 1;
      text-decoration: underline;
    }

    /* Light Theme Tweaks */
    [data-theme="light"] .hero-metrics-panel,
    [data-theme="light"] .dashboard-toolbar,
    [data-theme="light"] .problem-card {
      background: var(--card-bg) !important;
      border-color: #cbd5e1 !important;
    }

    [data-theme="light"] .progress-bar-container {
      background: #e2e8f0 !important;
      border-color: #cbd5e1 !important;
    }

    [data-theme="light"] .metric-pill {
      background: #f8fafc !important;
      border-color: #e2e8f0 !important;
    }

    [data-theme="light"] .btn-chip {
      background: #f1f5f9 !important;
      border-color: #cbd5e1 !important;
      color: #475569 !important;
    }

    [data-theme="light"] .btn-chip:hover {
      background: #e2e8f0 !important;
      color: #0f172a !important;
    }

    [data-theme="light"] .btn-chip.active {
      background: #0f172a !important;
      color: #ffffff !important;
      border-color: #0f172a !important;
    }

    /* Mobile Responsive Overrides (< 768px) */
    @media (max-width: 768px) {
      .container {
        padding: 1rem 0.85rem;
      }

      .dashboard-header-titles h1 {
        font-size: 1.4rem;
      }

      .dashboard-header-titles p {
        font-size: 0.8rem;
      }

      .hero-metrics-panel {
        padding: 1rem;
        gap: 0.75rem;
      }

      .metrics-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .dashboard-toolbar {
        padding: 0.85rem;
        gap: 0.75rem;
      }

      .filter-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }

      .filter-chips {
        width: 100%;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .filter-chips::-webkit-scrollbar {
        display: none;
      }

      .problems-grid {
        grid-template-columns: 1fr;
        gap: 0.85rem;
      }

      .problem-title {
        white-space: normal;
      }
    }

  </style>
</head>
<body>
  <div id="app-header"></div>

  <div class="container">
    <header class="dashboard-header">
      <div class="dashboard-header-titles">
        <h1>AlgoDeck Dashboard</h1>
        <p>Spaced Repetition & Pattern Mastery Tracker (Python & JS)</p>
      </div>
    </header>

    <!-- Compact Unified Hero Metrics Panel -->
    <div class="hero-metrics-panel">
      <div class="metrics-top-row">
        <div class="progress-summary">
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar"></div>
          </div>
          <span class="progress-text" id="progress-text">0 / 0 Solved (0%)</span>
        </div>
        <div class="user-elo-badge" id="user-rating-container" style="display: none;">
          <i class="fa-solid fa-trophy" style="color: #ffb020;"></i>
          <span>ELO: <strong id="user-rating-val">1200</strong></span>
        </div>
      </div>

      <!-- High-Density 4-Metric Strip -->
      <div class="metrics-grid">
        <div class="metric-pill">
          <span class="metric-pill-label">Mastered</span>
          <span class="metric-pill-val" id="matrix-clean-pass" style="color: #10b981;">0</span>
        </div>
        <div class="metric-pill">
          <span class="metric-pill-label">Assisted</span>
          <span class="metric-pill-val" id="matrix-assisted-pass" style="color: #3b82f6;">0</span>
        </div>
        <div class="metric-pill">
          <span class="metric-pill-label">Review Due</span>
          <span class="metric-pill-val" id="matrix-failed-attempt" style="color: #ef4444;">0</span>
        </div>
        <div class="metric-pill">
          <span class="metric-pill-label">Unsolved</span>
          <span class="metric-pill-val" id="matrix-unsolved" style="color: var(--text-muted);">0</span>
        </div>
      </div>
    </div>

    <!-- Consolidated High-Density Control Center -->
    <div class="dashboard-toolbar">
      <!-- Search Input Row -->
      <div class="search-row">
        <i class="fa-solid fa-magnifying-glass search-icon-pos"></i>
        <input type="text" id="search" class="search-input" placeholder="Search problems, patterns, or algorithms...">
      </div>

      <!-- Filter Row 1: Curriculum Level -->
      <div class="filter-row">
        <span class="filter-row-label">Level:</span>
        <div class="filter-chips" id="level-filters">
          <button class="btn-chip active" data-level="all">All Levels</button>
          <button class="btn-chip" data-level="1">L1: Linear</button>
          <button class="btn-chip" data-level="2">L2: Search & Trees</button>
          <button class="btn-chip" data-level="3">L3: Graphs</button>
          <button class="btn-chip" data-level="4">L4: DP</button>
          <button class="btn-chip" data-level="5">L5: CP Patterns</button>
        </div>
      </div>

      <!-- Filter Row 2: Difficulty -->
      <div class="filter-row">
        <span class="filter-row-label">Difficulty:</span>
        <div class="filter-chips" id="difficulty-filters">
          <button class="btn-chip active" data-diff="all">All Difficulties</button>
          <button class="btn-chip" data-diff="Easy" style="color: #10b981;">Easy</button>
          <button class="btn-chip" data-diff="Medium" style="color: #3b82f6;">Medium</button>
          <button class="btn-chip" data-diff="Hard" style="color: #ef4444;">Hard</button>
        </div>
      </div>

      <!-- Filter Row 3: Status & Review Queue -->
      <div class="filter-row">
        <span class="filter-row-label">Status:</span>
        <div class="filter-chips" id="status-filters">
          <button class="btn-chip active" data-status="all">All Items</button>
          <button class="btn-chip" data-status="unsolved">Unsolved</button>
          <button class="btn-chip" data-status="solved">Solved</button>
          <button class="btn-chip" id="due-filter-btn-dash" onclick="toggleDashDueFilter()" style="display: inline-flex; align-items: center; gap: 5px;">
            <i class="fa-solid fa-bell" style="font-size: 0.75rem;"></i> Due Today (<span id="dash-due-count">0</span>)
          </button>
        </div>
      </div>
    </div>

    <div class="problems-grid" id="problems-container">
      <div class="skeleton-card"><div class="skeleton-line skeleton-pulse"></div><div class="skeleton-line short skeleton-pulse"></div></div>
      <div class="skeleton-card"><div class="skeleton-line skeleton-pulse"></div><div class="skeleton-line short skeleton-pulse"></div></div>
      <div class="skeleton-card"><div class="skeleton-line skeleton-pulse"></div><div class="skeleton-line short skeleton-pulse"></div></div>
      <div class="skeleton-card"><div class="skeleton-line skeleton-pulse"></div><div class="skeleton-line short skeleton-pulse"></div></div>
      <div class="skeleton-card"><div class="skeleton-line skeleton-pulse"></div><div class="skeleton-line short skeleton-pulse"></div></div>
      <div class="skeleton-card"><div class="skeleton-line skeleton-pulse"></div><div class="skeleton-line short skeleton-pulse"></div></div>
    </div>
  </div>

  <script src="/js/tracker.js"></script>
  <script>
    let problemsData = [];
    let solvedSet = new Set(JSON.parse(localStorage.getItem('dsa_solved_problems') || '[]'));
    let activeDiff = 'all';
    let activeLevel = 'all';
    let searchQuery = '';    function renderHeader() {
        if (window.renderGlobalNavbar) {
            window.renderGlobalNavbar();
        }
    }
    renderHeader();

    async function loadData() {
      renderHeader();
      
      // Try to load dynamic server data if accessed via http/https protocol
      if (window.location.protocol.startsWith('http')) {
        try {
          const res = await fetch('/api/problems');
          const data = await res.json();
          problemsData = data.problems;
          
          // Populate solvedSet based on backend progress (repetitions > 0)
          solvedSet = new Set(problemsData.filter(p => p.repetitions > 0).map(p => p.id));
          localStorage.setItem('dsa_solved_problems', JSON.stringify(Array.from(solvedSet)));
          
          // Display ELO rating
          if (data.user_rating) {
            document.getElementById('user-rating-val').innerText = data.user_rating;
            document.getElementById('user-rating-container').style.display = 'inline-flex';
          }
          
          render();
          return;
        } catch (err) {
          console.warn('Backend server not reachable, falling back to static/local storage.', err);
        }
      }
      
      // Fallback for file:// protocol or server failure
      if (window.problemsData) {
        problemsData = window.problemsData;
        render();
      } else {
        try {
          const res = await fetch('./tracker.json');
          problemsData = await res.json();
          render();
        } catch (err) {
          console.error('Failed to load tracker.json', err);
        }
      }
    }

    async function toggleSolved(id) {
      const problem = problemsData.find(p => p.id === id);
      if (!problem) return;

      const checkbox = document.querySelector(`.problem-checkbox[data-id="${id}"]`);
      const isCurrentlySolved = solvedSet.has(id);
      const targetSolvedState = !isCurrentlySolved;
      const quality = targetSolvedState ? 5 : 0;

      if (window.location.protocol.startsWith('http')) {
        try {
          const res = await fetch('/api/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ problem_id: problem.id, quality: quality })
          });

          if (!res.ok) {
            console.error(`Failed to update progress for ${problem.id}: HTTP ${res.status}`);
            if (checkbox) checkbox.checked = isCurrentlySolved;
            return;
          }

          const data = await res.json();
          if (data && data.user_rating) {
            const ratingEl = document.getElementById('user-rating-val');
            if (ratingEl) ratingEl.innerText = data.user_rating;
          }
        } catch (e) {
          console.error('Failed to update backend progress:', e);
          if (checkbox) checkbox.checked = isCurrentlySolved;
          return;
        }
      }

      if (targetSolvedState) {
        solvedSet.add(id);
      } else {
        solvedSet.delete(id);
      }

      localStorage.setItem('dsa_solved_problems', JSON.stringify(Array.from(solvedSet)));
      updateProgress();
    }

    function updateProgress() {
      const total = problemsData.length;
      const solved = problemsData.filter(p => solvedSet.has(p.id)).length;
      const pct = total ? Math.round((solved / total) * 100) : 0;
      
      document.getElementById('progress-text').innerText = `${solved} / ${total} Solved (${pct}%)`;
      document.getElementById('progress-bar').style.width = `${pct}%`;
    }

    let activeDueOnly = false;

    function toggleDashDueFilter() {
      activeDueOnly = !activeDueOnly;
      const btn = document.getElementById("due-filter-btn-dash");
      if (btn) {
        btn.classList.toggle("active", activeDueOnly);
        if (activeDueOnly) {
          btn.style.background = "rgba(239, 68, 68, 0.25)";
          btn.style.borderColor = "rgba(239, 68, 68, 0.5)";
          btn.style.color = "#ef4444";
        } else {
          btn.style.background = "";
          btn.style.borderColor = "";
          btn.style.color = "";
        }
      }
      render();
    }

    let activeStatus = 'all';

    function updateActivityMatrixCounts() {
      let cleanPass = 0, assistedPass = 0, failedAttempt = 0, unsolved = 0;

      problemsData.forEach(p => {
        const isSolved = solvedSet.has(p.id) || (p.repetitions > 0);
        const assistance = p.assistance_level || 'CLEAN';

        if (!isSolved) {
          unsolved++;
        } else if (p.is_due) {
          failedAttempt++;
        } else if (assistance === 'HINT_USED' || assistance === 'SOLUTION_REVEALED') {
          assistedPass++;
        } else {
          cleanPass++;
        }
      });

      const elClean = document.getElementById('matrix-clean-pass');
      const elAssisted = document.getElementById('matrix-assisted-pass');
      const elFailed = document.getElementById('matrix-failed-attempt');
      const elUnsolved = document.getElementById('matrix-unsolved');

      if (elClean) elClean.innerText = cleanPass;
      if (elAssisted) elAssisted.innerText = assistedPass;
      if (elFailed) elFailed.innerText = failedAttempt;
      if (elUnsolved) elUnsolved.innerText = unsolved;
    }

    function render() {
      const container = document.getElementById('problems-container');
      container.innerHTML = '';

      updateActivityMatrixCounts();

      const dueCount = problemsData.filter(p => p.is_due).length;
      const dashDueEl = document.getElementById('dash-due-count');
      if (dashDueEl) dashDueEl.innerText = dueCount;

      const filtered = problemsData.filter(p => {
        const isSolved = solvedSet.has(p.id) || (p.repetitions > 0);
        const matchesDiff = activeDiff === 'all' || p.difficulty === activeDiff;
        const matchesLevel = activeLevel === 'all' || p.level === parseInt(activeLevel);
        const matchesSearch = p.title.toLowerCase().includes(searchQuery) || 
                              p.pattern.toLowerCase().includes(searchQuery);
        const matchesDue = !activeDueOnly || p.is_due === true;
        const matchesStatus = activeStatus === 'all' || 
                              (activeStatus === 'solved' && isSolved) || 
                              (activeStatus === 'unsolved' && !isSolved);
        return matchesDiff && matchesLevel && matchesSearch && matchesDue && matchesStatus;
      });

      filtered.forEach(p => {
        const isSolved = solvedSet.has(p.id) || (p.repetitions > 0);
        const assistance = p.assistance_level || 'CLEAN';

        let activityTagHtml = `<span class="tag" style="background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1);">⚪ New / Unsolved</span>`;
        if (isSolved && (assistance === 'HINT_USED' || assistance === 'SOLUTION_REVEALED')) {
          activityTagHtml = `<span class="tag" style="background: rgba(59,130,246,0.15); color: #3b82f6; border: 1px solid rgba(59,130,246,0.3);">🔓 Assisted Pass</span>`;
        } else if (isSolved) {
          activityTagHtml = `<span class="tag" style="background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3);">✅ Mastered</span>`;
        } else if (p.is_due) {
          activityTagHtml = `<span class="tag" style="background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3);">🔔 Review Due</span>`;
        }

        const playgroundUrl = window.location.protocol === 'file:' 
          ? './playground.html' 
          : '/playground.html';

        const card = document.createElement('div');
        card.className = 'problem-card';
        card.innerHTML = `
          <div>
            <div class="problem-header">
              ${isSolved ? `<span class="solved-badge" data-id="${p.id}" title="Solved"><i class="fa-solid fa-circle-check" style="color: var(--accent-green); font-size: 1.1rem;"></i></span>` : `<span class="unsolved-badge" data-id="${p.id}" title="Not yet solved"><i class="fa-regular fa-circle" style="color: var(--text-muted); font-size: 1.1rem; opacity: 0.4;"></i></span>`}
              <div class="problem-title-area">
                <a href="${playgroundUrl}?id=${p.id}" class="problem-title">${p.title}</a>
                <div class="problem-tags">
                  <span class="tag tag-${p.difficulty.toLowerCase()}">${p.difficulty}</span>
                  <span class="tag tag-pattern">${p.pattern}</span>
                  ${activityTagHtml}
                </div>
              </div>
            </div>
            <div class="action-links">
              <a href="${playgroundUrl}?id=${p.id}" class="action-btn practice-btn">
                <i class="fa-solid fa-code"></i> Code Offline
              </a>
              <a href="${p.problemUrl}" target="_blank" class="action-btn external-btn">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> External Link
              </a>
            </div>
          </div>
          <div class="problem-footer">
            <span>Level ${p.level} • ${p.platform}</span>
            <div class="code-links">
              <a href="${playgroundUrl}?id=${p.id}&lang=python">Python</a>
              <a href="${playgroundUrl}?id=${p.id}&lang=javascript">JS</a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      updateProgress();
    }

    // Event Listeners
    document.getElementById('search').addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase();
      render();
    });

    document.querySelectorAll('#difficulty-filters .btn-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#difficulty-filters .btn-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeDiff = btn.dataset.diff;
        render();
      });
    });

    document.querySelectorAll('#level-filters .btn-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#level-filters .btn-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeLevel = btn.dataset.level;
        render();
      });
    });

    document.querySelectorAll('#status-filters .btn-chip').forEach(btn => {
      if (btn.id === 'due-filter-btn-dash') return;
      btn.addEventListener('click', () => {
        document.querySelectorAll('#status-filters .btn-chip').forEach(b => {
          if (b.id !== 'due-filter-btn-dash') b.classList.remove('active');
        });
        btn.classList.add('active');
        activeStatus = btn.dataset.status;
        render();
      });
    });

    loadData();
  </script>
</body>
</html>
