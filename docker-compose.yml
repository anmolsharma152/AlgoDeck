version: '3.8'

services:
  app:
    build: .
    container_name: algodeck_app
    restart: unless-stopped
    ports:
      - "0.0.0.0:3095:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=algodeck_user
      - POSTGRES_PASSWORD=algodeck_secure_pass
      - POSTGRES_DB=algodeck
      - TRUST_PROXY=loopback
    networks:
      - default
      - homelab

networks:
  homelab:
    external: true
