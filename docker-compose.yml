version: '3.8'

services:
  app:
    build: .
    container_name: algodeck_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3095:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=algodeck_secure_pass
      - POSTGRES_DB=algodeck
    networks:
      - default
      - homelab
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: algodeck_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - default
      - homelab
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: algodeck_secure_pass
      POSTGRES_DB: algodeck
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d algodeck"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  homelab:
    external: true

volumes:
  pgdata:
